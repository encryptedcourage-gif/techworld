# Render Blueprint for Claude Studio (the public AI assistant site).
#
# Easiest path is the manual setup in DEPLOY.md (no blueprint needed).
# If you prefer one-click: copy this file's `services:` block into the
# render.yaml at the REPOSITORY ROOT (Render only reads the root one), then in
# Render: New + -> Blueprint -> connect this repo -> pick your branch -> Apply.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: claude-studio
    runtime: node
    # Free plan has NO persistent disk, so the accounts database would reset on
    # every restart. "starter" (~$7/mo) supports the disk below. Use "free"
    # only for throwaway testing.
    plan: starter
    region: oregon
    rootDir: claude-studio/server
    buildCommand: npm install
    startCommand: npm start
    # Keeps the SQLite accounts/files database across restarts and deploys.
    disk:
      name: studio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Which AI serves free vs. paying users (gemini | groq | anthropic).
      - key: AI_PROVIDER
        value: gemini
      - key: PAID_AI_PROVIDER
        value: groq
      # Free API keys — paste them in the Render dashboard (kept secret).
      # Gemini: https://aistudio.google.com   Groq: https://console.groq.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # A strong login-signing secret is generated for you.
      - key: JWT_SECRET
        generateValue: true
      # Store the database on the persistent disk mounted above.
      - key: DB_PATH
        value: /data/studio.db
      # Free trial length and message caps (protects your bill).
      - key: FREE_TRIAL_DAYS
        value: "1"
      - key: FREE_MONTHLY_LIMIT
        value: "25"
      - key: BASIC_MONTHLY_LIMIT
        value: "300"
      - key: PRO_MONTHLY_LIMIT
        value: "2000"
      # --- Fill these in the dashboard once your site URL and Stripe exist ---
      # PUBLIC_URL: set to the https URL Render gives you after first deploy.
      - key: PUBLIC_URL
        sync: false
      # Stripe — leave unset to launch in FREE mode; add later to take payments.
      # Create two monthly Prices in Stripe: $10 (Basic) and $20 (Pro).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
