<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · Claude Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" id="brand">Admin · Claude Marketplace</div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <main id="app"></main>

    <template id="tpl-login">
      <section class="card auth-card">
        <h2>Admin sign in</h2>
        <p class="muted">Control panel — customers cannot sign in here.</p>
        <form id="loginForm">
          <label>Email<input type="email" id="loginEmail" autocomplete="username" required /></label>
          <label>Password<input type="password" id="loginPassword" autocomplete="current-password" required /></label>
          <button class="primary" type="submit">Sign in</button>
          <p class="error" id="loginError"></p>
        </form>
      </section>
    </template>

    <template id="tpl-admin">
      <nav class="tabs">
        <button class="tab active" data-tab="inbox">Inbox <span class="badge" id="inboxBadge" hidden>0</span></button>
        <button class="tab" data-tab="plans">Plans</button>
        <button class="tab" data-tab="members">Members</button>
      </nav>

      <section class="tab-page" data-page="inbox">
        <div class="inbox-toolbar">
          <button id="clearAllChats" class="danger">Clear ALL chats</button>
          <span class="muted small">Deletes every message in every conversation. Member accounts stay.</span>
        </div>
        <div class="layout">
          <aside class="panel conv-list" id="convList"></aside>
          <section class="panel chat-panel">
            <div class="chat-head">
              <h2 id="convTitle">Select a conversation</h2>
              <div class="chat-head-actions" id="chatHeadActions" hidden>
                <button id="clearChat">Clear chat</button>
                <button id="closeAccount" class="danger">Close account</button>
              </div>
            </div>
            <p class="muted small" id="convHint" hidden>Tip: hover a message and click ✕ to delete just that message.</p>
            <div class="chat" id="adminChat"></div>
            <form class="composer" id="adminComposer" hidden>
              <input type="text" id="adminInput" placeholder="Reply to this member…" autocomplete="off" />
              <button class="primary" type="submit">Send</button>
            </form>
          </section>
        </div>
      </section>

      <section class="tab-page" data-page="plans" hidden>
        <div class="panel">
          <h2>Subscription plans</h2>
          <p class="muted small">These show on the customer site. Members click Buy to start a chat with you.</p>
          <form class="plan-form" id="planForm">
            <input type="hidden" id="planId" />
            <div class="row">
              <label>Name<input id="planName" placeholder="Claude Pro" required /></label>
              <label>Price<input id="planPrice" type="number" min="0" step="0.01" placeholder="20.00" required /></label>
              <label>Currency<input id="planCurrency" value="USD" maxlength="3" /></label>
              <label>Billing
                <select id="planPeriod">
                  <option value="month">Monthly</option>
                  <option value="once">One-time</option>
                </select>
              </label>
            </div>
            <label>Description<textarea id="planDesc" placeholder="What the member gets…"></textarea></label>
            <div class="row">
              <button class="primary" type="submit" id="planSubmit">Add plan</button>
              <button type="button" class="ghost" id="planReset" hidden>Cancel edit</button>
            </div>
            <p class="error" id="planError"></p>
          </form>
          <div class="admin-plans" id="adminPlans"></div>
        </div>
      </section>

      <section class="tab-page" data-page="members" hidden>
        <div class="panel">
          <h2>Members</h2>
          <p class="muted small">You create every member account. Give them the customer link + their email + password.</p>
          <form class="member-form" id="memberForm">
            <div class="row">
              <label>Name<input id="newName" placeholder="Jane Doe" /></label>
              <label>Email<input id="newEmail" type="email" placeholder="jane@email.com" required /></label>
              <label>Password<input id="newPassword" placeholder="at least 6 characters" required /></label>
            </div>
            <button class="primary" type="submit">Create member</button>
            <p class="error" id="memberError"></p>
          </form>
          <div class="member-list" id="memberList"></div>
        </div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
