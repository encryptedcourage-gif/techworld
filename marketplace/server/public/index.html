<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" id="brand">Claude Marketplace</div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <main id="app"></main>

    <!-- Templates are cloned by app.js -->
    <template id="tpl-public">
      <section class="hero">
        <h1>Get set up on <span>Claude.ai</span> — the easy way</h1>
        <p class="lead">Pick a plan below. After you buy, you'll chat directly with us and
          we'll help you open and subscribe your Claude account, send it to you, and show
          you how to use it for writing, science, coding and more.</p>
      </section>
      <section class="plans" id="publicPlans"></section>
      <section class="signin-cta">
        <p>Already a member? <button class="link" id="goSignIn">Sign in</button> to continue your chat.</p>
        <p class="muted small">Accounts are created by the admin. Ask for your login if you don't have one yet.</p>
      </section>
    </template>

    <template id="tpl-login">
      <section class="card auth-card">
        <h2>Sign in</h2>
        <p class="muted">Use the email and password the admin gave you.</p>
        <form id="loginForm">
          <label>Email<input type="email" id="loginEmail" autocomplete="username" required /></label>
          <label>Password<input type="password" id="loginPassword" autocomplete="current-password" required /></label>
          <button class="primary" type="submit">Sign in</button>
          <p class="error" id="loginError"></p>
        </form>
        <button class="link" id="backHome">← Back to plans</button>
      </section>
    </template>

    <!-- Member dashboard -->
    <template id="tpl-member">
      <div class="layout">
        <section class="panel">
          <h2>Claude subscription plans</h2>
          <div class="plans" id="memberPlans"></div>
        </section>
        <section class="panel chat-panel">
          <h2>Chat with the admin <span class="badge" id="memberBadge" hidden>0</span></h2>
          <p class="muted small">This chat stays here. Sign in anytime to pick up where you left off.</p>
          <div class="chat" id="memberChat"></div>
          <form class="composer" id="memberComposer">
            <input type="text" id="memberInput" placeholder="Type a message…" autocomplete="off" />
            <button class="primary" type="submit">Send</button>
          </form>
        </section>
      </div>
    </template>

    <!-- Admin dashboard -->
    <template id="tpl-admin">
      <nav class="tabs">
        <button class="tab active" data-tab="inbox">Inbox <span class="badge" id="inboxBadge" hidden>0</span></button>
        <button class="tab" data-tab="plans">Plans</button>
        <button class="tab" data-tab="members">Members</button>
      </nav>

      <section class="tab-page" data-page="inbox">
        <div class="layout">
          <aside class="panel conv-list" id="convList"></aside>
          <section class="panel chat-panel">
            <h2 id="convTitle">Select a conversation</h2>
            <div class="chat" id="adminChat"></div>
            <form class="composer" id="adminComposer" hidden>
              <input type="text" id="adminInput" placeholder="Reply to this member…" autocomplete="off" />
              <button class="primary" type="submit">Send</button>
            </form>
          </section>
        </div>
      </section>

      <section class="tab-page" data-page="plans" hidden>
        <div class="panel">
          <h2>Subscription plans</h2>
          <p class="muted small">These show on the public page. Members click Buy to start a chat with you.</p>
          <form class="plan-form" id="planForm">
            <input type="hidden" id="planId" />
            <div class="row">
              <label>Name<input id="planName" placeholder="Claude Pro" required /></label>
              <label>Price<input id="planPrice" type="number" min="0" step="0.01" placeholder="20.00" required /></label>
              <label>Currency<input id="planCurrency" value="USD" maxlength="3" /></label>
              <label>Billing
                <select id="planPeriod">
                  <option value="month">Monthly</option>
                  <option value="once">One-time</option>
                </select>
              </label>
            </div>
            <label>Description<textarea id="planDesc" placeholder="What the member gets…"></textarea></label>
            <div class="row">
              <button class="primary" type="submit" id="planSubmit">Add plan</button>
              <button type="button" class="ghost" id="planReset" hidden>Cancel edit</button>
            </div>
            <p class="error" id="planError"></p>
          </form>
          <div class="admin-plans" id="adminPlans"></div>
        </div>
      </section>

      <section class="tab-page" data-page="members" hidden>
        <div class="panel">
          <h2>Members</h2>
          <p class="muted small">You create every member account. Give them the email + password to sign in.</p>
          <form class="member-form" id="memberForm">
            <div class="row">
              <label>Name<input id="newName" placeholder="Jane Doe" /></label>
              <label>Email<input id="newEmail" type="email" placeholder="jane@email.com" required /></label>
              <label>Password<input id="newPassword" placeholder="at least 6 characters" required /></label>
            </div>
            <button class="primary" type="submit">Create member</button>
            <p class="error" id="memberError"></p>
          </form>
          <div class="member-list" id="memberList"></div>
        </div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
