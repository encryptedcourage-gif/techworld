<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" id="brand">Claude Marketplace</div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <main id="app"></main>

    <template id="tpl-public">
      <section class="hero">
        <h1>Get set up on <span>Claude.ai</span> — the easy way</h1>
        <p class="lead">Pick a plan below. After you buy, you'll chat directly with us and
          we'll help you open and subscribe your Claude account, send it to you, and show
          you how to use it for writing, science, coding and more.</p>
      </section>
      <section class="plans" id="publicPlans"></section>
      <section class="signin-cta">
        <p>Already a member? <button class="link" id="goSignIn">Sign in</button> to continue your chat.</p>
        <p class="muted small">Accounts are created by the admin. Ask for your login if you don't have one yet.</p>
      </section>
    </template>

    <template id="tpl-login">
      <section class="card auth-card">
        <h2>Sign in</h2>
        <p class="muted">Use the email and password the admin gave you.</p>
        <form id="loginForm">
          <label>Email<input type="email" id="loginEmail" autocomplete="username" required /></label>
          <label>Password<input type="password" id="loginPassword" autocomplete="current-password" required /></label>
          <button class="primary" type="submit">Sign in</button>
          <p class="error" id="loginError"></p>
        </form>
        <button class="link" id="backHome">← Back to plans</button>
      </section>
    </template>

    <template id="tpl-member">
      <div class="layout">
        <section class="panel">
          <h2>Claude subscription plans</h2>
          <div class="plans" id="memberPlans"></div>
        </section>
        <section class="panel chat-panel">
          <h2>Chat with the admin <span class="badge" id="memberBadge" hidden>0</span></h2>
          <p class="muted small">This chat stays here. Sign in anytime to pick up where you left off.</p>
          <div class="chat" id="memberChat"></div>
          <form class="composer" id="memberComposer">
            <input type="text" id="memberInput" placeholder="Type a message…" autocomplete="off" />
            <button class="primary" type="submit">Send</button>
          </form>
        </section>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
